[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lair"
description = "Python package for land-air interactions research."
authors = [
    {name = "James Mineau", email = "James.Mineau@utah.edu"},
]
readme = "README.md"
keywords = ["land-air interactions", "research", "pollution", "atmospheric science"]
dynamic = ["version"]  # from git tags via setuptools-scm (see [tool.setuptools_scm])
requires-python = ">=3.11"
dependencies = [
  "cf_xarray>=0.10.4",  # 0.10.3 and earlier import xarray.core.arithmetic, gone from xarray 2026
  "dask>=2024.4.2",  # 2024.1.0 fails 4 tests
  "matplotlib>=3.8",
  "netcdf4>=1.7.1",  # 1.6.5 fails 26 tests
  "numpy>=1.26",  # what pandas 3 needs
  "pandas>=3.0",  # pandas 3 only: the tests run on pandas 3, and nothing on pandas 2
  "pint>=0.24.4",  # sort_by_dimensionality (lair/__init__.py); 0.24.0 to 0.24.3 do not import with flexparser 0.4
  "pint-xarray>=0.3",
  "xarray>=2025.3.0",  # 2025.1.x fails 24 tests
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Remote data access (AWS S3, soundings)
requests = [
  "boto3",
  "requests",
  # The newest boto3 is often ahead of the botocore that s3fs's aiobotocore
  # allows; without a floor, resolvers keep boto3 and go back to s3fs 0.4.2
  # (2020). 2023.10.0 pins fsspec 2023.10.0, the oldest that zarr 3 reads
  # remote stores with.
  "s3fs>=2023.10.0",
  "siphon",
]

# Alternative data formats (Zarr, KML)
formats = [
  "zarr",
  "numcodecs",
  "fastkml",
  "lxml",  # speeds up fastkml
]

# Geographic data processing
geo = [
  "cartopy",
  "networkx",
  "pyproj",
  "rasterio",
  "rioxarray",
  "shapely",
]

# Scientific computing (chemistry, CCG filter)
science = [
  "molmass",
  "scipy",
]

# Advanced regridding
regridding = [
  "xesmf",
]

# Complete installation with all optional dependencies
complete = [
  "lair[requests]",
  "lair[formats]",
  "lair[geo]",
  "lair[science]",
  "lair[regridding]",
]

[project.urls]
Documentation = "https://jmineau.github.io/lair/"
Repository = "https://github.com/jmineau/lair.git"
Issues = "https://github.com/jmineau/lair/issues"
Changelog = "https://github.com/jmineau/lair/blob/main/CHANGELOG.md"

[dependency-groups]
# Lean tooling-only group so `uv sync` is fast and reliable on any Python.
# It does NOT install the optional-dependency extras (geo/formats/regridding
# need conda-built ESMF / heavy binary wheels) — tests for those modules
# `importorskip` and are skipped here. For full optional-dependency coverage,
# use the pixi environment (`[tool.pixi]` below) and run `pixi run pytest`.
dev = [
  "docstr-coverage>=2.3",
  "git-cliff>=2.10",  # `just changelog`
  "ipython>=9.0",  # `.. ipython::` in the docs
  "matplotlib>=3.8",  # `.. plot::` in the docs
  "pre-commit>=4.0",
  "pydata-sphinx-theme>=0.22",  # older themes show the version banner on stable/ for PEP 440 versions
  "pyrefly>=1.3",
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.16",
  "rust-just>=1.42.4",
  "setuptools-scm>=8",  # `just version` / `just release`
  "sphinx>=8.2",  # what pydata-sphinx-theme 0.22 requires
  "sphinx-autobuild>=2024.10",  # `just docs-serve`
  "sphinx-copybutton>=0.5",
  "twine>=6.0",  # `just dist`
]

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when pyproject.toml or the git state changes, so
# `__version__` follows new commits and tags. This replaces uv's default keys, so
# add { file = "setup.py" } (and any C sources) if the project has them.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lair*"]

[tool.setuptools.package-data]
"lair" = ["py.typed"]  # the annotations are part of the API (PEP 561)

[tool.setuptools_scm]
# CalVer releases are git tags vYYYY.MM.PATCH (MM = 05, 08 or 12), made with
# `just release`. Between releases the version is the next patch as a dev
# version, e.g. 2026.12.4.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "lair"]  # lair: the docstring examples (--doctest-modules below); the package is flat, not src/
strict = true  # strict markers, config, xfail and parametrize ids
# --doctest-modules runs the `>>>` examples in docstrings as tests. A module that imports an
# optional package at the top cannot be collected without it (the lean environment):
# --doctest-ignore-import-errors skips its examples there, as tests behind a missing extra
# skip. The pixi environment, which has every extra, runs them all.
addopts = ["-ra", "--doctest-modules", "--doctest-ignore-import-errors"]
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    # matplotlib before 3.10.7 calls pyparsing methods that pyparsing 3.3 deprecates.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
    # netCDF4 1.7.4 sets an array's shape when it writes a variable, which
    # NumPy 2.5 deprecates.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # rioxarray 0.23 multiplies affine transforms with `*`, which affine 3.0
    # deprecates.
    "ignore:Use `@` matmul instead of `\\*` mul:PendingDeprecationWarning:rioxarray",
]
markers = [
    "network: requires live network access to external services (NOAA GML/FTP, AWS S3, MesoWest, soundings)",
    "slow: expensive runtime, bandwidth, or disk usage; excluded from default test runs",
]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.coverage.run]
source = ["lair"]
branch = true
omit = ["lair/_ccg_filter.py"]  # vendored from NOAA GML, not authored here

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.pyrefly]
# Enforced gate (CI + pre-commit): `just type-check` must pass. Where the
# library stubs are wrong or too narrow, suppress inline on that line with a
# reason, e.g. `# pyrefly: ignore[no-matching-overload]`, rather than loosening
# the config. Tighten over time (e.g. `preset = "strict"`).
project-includes = ["lair"]
python-version = "3.11"  # as CI checks, against the oldest supported Python
project-excludes = [
    "lair/_ccg_filter.py",  # vendored from NOAA GML
    "**/__pycache__",
]
# Optional extras (and their transitive helpers) are typed as Any so the result
# is the same whether the extras are installed (the pixi env) or not (the lean
# uv env). Core deps (numpy/pandas/xarray/matplotlib/pint) stay typed.
# Subclasses pin class constants (e.g. `version: str = 'v8'`) over base-class
# attributes typed more loosely (`str | None`); that's intended here.
errors = { bad-override-mutable-attribute = false }
replace-imports-with-any = [
    "lair._ccg_filter",  # downloaded from NOAA GML on first import; absent in CI
    "boto3.*", "botocore.*", "cartopy.*", "fastkml.*", "molmass.*",
    "networkx.*", "numcodecs.*", "pyproj.*", "rasterio.*", "requests.*",
    "rioxarray.*", "s3fs.*", "scipy.*", "shapely.*", "siphon.*",
    "xesmf.*", "zarr.*",
]

[tool.ruff]
# target-version comes from project.requires-python
# Generated / vendored modules are not linted.
extend-exclude = [
    "lair/_ccg_filter.py", # vendored from NOAA GML
]

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "E741",  # ambiguous variable names (l, I, O) — common in science code
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["lair"]

[tool.ruff.lint.per-file-ignores]
# Intentional, kept on purpose (NOT a legacy backlog):
"lair/__init__.py" = ["F401"]   # cf_xarray.units / pint_xarray / config: side-effect & re-export imports
"lair/soundings.py" = ["E402"]  # import after optional-dependency check (intentional)
# Tests need no docstrings, and a fixture's names what it provides ("A tiny
# Vulcan archive."); the other docstring rules still apply to them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D106", "D107", "D401"]

# The environment with every extra. xesmf needs ESMF from conda-forge; pixi
# installs the conda packages named here and everything else from the
# dependencies above, and locks both in pixi.lock.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# The no-MPI ESMF build: the MPICH build starts MPI on import, and when that
# start-up fails it kills the whole process group.
esmf = { version = "*", build = "nompi*" }
esmpy = ">=8.4"
xesmf = "*"

[tool.pixi.pypi-dependencies]
lair = { path = ".", editable = true }
# Not a dependency of lair: `lair.geo.clip` takes a GeoSeries, and one test
# builds one.
geopandas = "*"

[tool.pixi.environments]
default = { features = ["complete", "dev"] }
