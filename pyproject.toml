[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lair"
description = "Python package for land-air interactions research."
authors = [
    {name = "James Mineau", email = "James.Mineau@utah.edu"},
]
readme = "README.md"
keywords = ["land-air interactions", "research", "pollution", "atmospheric science"]
dynamic = ["version"]  # from git tags via setuptools-scm (see [tool.setuptools_scm])
requires-python = ">=3.10"
dependencies = [
  "cf_xarray",
  "dask",
  "matplotlib",
  "netcdf4",
  "numpy",
  "pandas",
  "pint",
  "pint-xarray",
  "typing-extensions",  # needed to import Self before 3.11
  "xarray",
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]

[project.optional-dependencies]
# Remote data access (AWS S3, soundings)
requests = [
  "boto3",
  "requests",
  "s3fs",
  "siphon",
]

# Alternative data formats (Zarr, KML)
formats = [
  "zarr",
  "numcodecs",
  "fastkml",
  "lxml",  # speeds up fastkml
]

# Geographic data processing
geo = [
  "cartopy",
  "networkx",
  "pyproj",
  "rasterio",
  "rioxarray",
  "shapely",
]

# Scientific computing (chemistry, CCG filter)
science = [
  "molmass",
  "scipy",
]

# Advanced regridding
regridding = [
  "xesmf",
]

# Complete installation with all optional dependencies
complete = [
  "lair[requests]",
  "lair[formats]",
  "lair[geo]",
  "lair[science]",
  "lair[regridding]",
]

[project.urls]
Documentation = "https://jmineau.github.io/lair/"
Repository = "https://github.com/jmineau/lair.git"
Issues = "https://github.com/jmineau/lair/issues"

[dependency-groups]
# Lean tooling-only group so `uv sync` is fast and reliable on any Python.
# It does NOT install the optional-dependency extras (geo/formats/regridding
# need conda-built ESMF / heavy binary wheels) — tests for those modules
# `importorskip` and are skipped here. For full optional-dependency coverage,
# use the conda `lair-dev` env (see env-dev.yml) and run `pytest` there.
dev = [
  "pre-commit>=3.0.0",
  "pydata-sphinx-theme>=0.14.0",
  "pyrefly>=1.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "rust-just>=1.42.4",
  "setuptools-scm>=8",  # `just version` / `just release`
  "sphinx>=7.0.0",
]

[tool.uv]
required-version = ">=0.10.4"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lair*"]

[tool.setuptools_scm]
# CalVer releases are git tags vYYYY.MM.PATCH (MM = 05, 08 or 12), made with
# `just release`. Between releases the version is the next patch as a dev
# version, e.g. 2026.12.4.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires live network access to external services (NOAA GML/FTP, AWS S3, MesoWest, soundings)",
    "slow: expensive runtime, bandwidth, or disk usage; excluded from default test runs",
    "chpc: requires CHPC filesystem paths or group data; not runnable off-cluster",
]

[tool.coverage.run]
source = ["lair"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "lair/_ccg_filter.py",  # vendored from NOAA GML, not authored here
]

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.pyrefly]
# Lenient baseline: lair is a loosely-typed grab-bag. Type checking is currently
# ADVISORY (non-blocking in CI) — run it with `just type-check`. Tighten over
# time (drop the excludes, then raise to `preset = "strict"`) as modules get
# annotated, and flip the CI step to a hard gate once it's clean.
project-includes = ["lair"]
project-excludes = [
    "lair/_ccg_filter.py",  # vendored from NOAA GML
    "lair/noaa.py",         # WIP
    "**/__pycache__",
]
# Optional extras (and their transitive helpers) are typed as Any so the result
# is the same in the lean uv env (extras absent) and the conda lair-dev env
# (extras installed). Core deps (numpy/pandas/xarray/matplotlib/pint) stay typed.
replace-imports-with-any = [
    "boto3.*", "botocore.*", "cartopy.*", "fastkml.*", "molmass.*",
    "networkx.*", "numcodecs.*", "pyproj.*", "rasterio.*", "requests.*",
    "rioxarray.*", "s3fs.*", "scipy.*", "shapely.*", "siphon.*",
    "xesmf.*", "zarr.*",
]

[tool.ruff]
target-version = "py310"
# WIP / generated / non-runtime modules are not linted. Remove from this list
# as each is finished or fixed (see per-file-ignores for the legacy baseline).
extend-exclude = [
    "lair/noaa.py",        # WIP
    "lair/_ccg_filter.py", # vendored from NOAA GML
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Conservative baseline to avoid churn on existing code (see AGENTS.md).
# Start with the high-signal pyflakes/pycodestyle-error rules; broaden
# (UP, B, SIM, I, ...) as modules get cleaned up.
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
]
ignore = [
    "E501",  # line too long, handled by formatter
    "E741",  # ambiguous variable names (l, I, O) — common in science code
]

[tool.ruff.lint.isort]
known-first-party = ["lair"]

[tool.ruff.lint.per-file-ignores]
# Intentional, kept on purpose (NOT a legacy backlog):
"lair/__init__.py" = ["F401"]   # cf_xarray.units / pint_xarray / config: side-effect & re-export imports
"lair/soundings.py" = ["E402"]  # import after optional-dependency check (intentional)
