name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LAIR_SKIP_CCG_DOWNLOAD: "1"

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # setuptools-scm needs the tags for the version

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.10.4"
        enable-cache: true
        python-version: '3.10'

    - name: Sync dependencies (lean dev group)
      run: uv sync --frozen

    # Enforced gate.
    - name: Lint with ruff
      run: uv run --no-sync ruff check --output-format=github lair tests

    # Enforced gate: pyrefly passes cleanly (suppressions are inline, with a
    # reason). See [tool.pyrefly] in pyproject.toml.
    - name: Type check with pyrefly
      if: ${{ !cancelled() }}
      run: uv run --no-sync pyrefly check
