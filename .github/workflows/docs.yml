name: Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Never reach for the NOAA GML FTP download at import time; docs mock the
  # generated CCG filter module instead (see docs/conf.py).
  LAIR_SKIP_CCG_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm needs the tags for the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"
          enable-cache: true
          python-version: '3.12'

      - name: Sync dependencies (lean dev group; optional extras are mocked)
        run: uv sync --frozen

      - name: Build documentation
        run: uv run --no-sync sphinx-build -M html docs docs/_build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
