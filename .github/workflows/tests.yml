name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Never download NOAA GML's CCG filter when lair is imported; it is not in
  # the repo (see lair/__init__.py), and the docs mock it. The pixi job below
  # is the one exception: it fetches the filter so tests/background runs.
  LAIR_SKIP_CCG_DOWNLOAD: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run just cov

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

  # The job above installs no extras, so the tests of the modules behind them
  # skip. This job runs the whole suite in the pixi environment (`[tool.pixi]`
  # in pyproject.toml, locked in pixi.lock), which has every extra: xesmf needs
  # conda-forge's ESMF, so it cannot come from uv.lock.
  pixi:
    name: pixi env (every extra)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true  # fail if pixi.lock is out of date with pyproject.toml
          cache: true

      # tests/background needs NOAA's CCG filter, which is not in the repo (see
      # lair/__init__.py) and which the uv job above cannot use anyway: it has
      # no scipy. This is the only job that downloads it. The cache key changes
      # each month, so most runs reuse the file and the server is reached about
      # once a month (more often for a pull request before main has saved the
      # month's copy). A failed download fails this step; it does not skip the tests.
      - name: Get the month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache NOAA's CCG filter
        uses: actions/cache@v6
        with:
          path: lair/_ccg_filter.py
          key: ccg-filter-${{ steps.month.outputs.month }}

      - name: Download NOAA's CCG filter
        timeout-minutes: 5
        env:
          LAIR_SKIP_CCG_DOWNLOAD: ""  # empty text downloads; the workflow sets "1"
        run: pixi run python -c "import lair; lair.setup_ccg_filter()"

      - name: Test
        run: pixi run pytest -n auto --maxprocesses=8 -m "not network and not slow" --cov --cov-report=xml

      # The modules behind the extras run only here, so without this upload
      # Codecov counts them as untested. Codecov merges it with the upload of
      # the job above: a line run in either job is covered.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
